services:
  frontend:
    build:
      context: ./apache
    container_name: ths_frontend
    restart: unless-stopped
    ports:
      - "${WP_PORT}:80"
    volumes:
      - ./frontend:/usr/local/apache2/htdocs:ro
    depends_on:
      - wordpress
    networks:
      - wordpress_network
  db:
    image: mariadb:11.8
    container_name: ${DB_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "healthcheck.sh",
          "--connect",
          "--innodb_initialized"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - wordpress_network
  wordpress:
    depends_on:
      db:
        condition: service_healthy
    image: wordpress:7.1.0-php8.3-apache
    container_name: ${WP_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}

      WORDPRESS_CONFIG_EXTRA: |
        define('FS_METHOD', 'direct');

    volumes:
      - wp_data:/var/www/html
      - ./backend/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini

    networks:
      - wordpress_network
volumes:
  db_data:
  wp_data:

networks:
  wordpress_network:
    driver: bridge